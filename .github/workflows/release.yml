name: Release

on:
  # Every push to main lets Release Please open/update the release PR. Nothing is
  # released until that PR is merged — the merge push then tags, builds and publishes.
  push:
    branches: [main]
  # Manual fallback: re-run Release Please, or rebuild an existing tag.
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options:
          - create-release
          - build-existing-tag
        default: create-release
      tag_name:
        description: "Existing tag to build (only for 'build-existing-tag', e.g. dashboard-v0.1.50)"
        required: false

# Least privilege: each job grants only what it needs.
permissions: {}

# Overlapping releases race on GHCR tags and the version.json push — queue them, never cancel.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/dashboard
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Run Release Please: opens/updates the release PR, or tags the release once it is merged.
  # Runs on every push to main and on a manual 'create-release'.
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'create-release' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.resolve.outputs.release_created }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Release-Please outputs use component prefix (dashboard--) for multi-package repos.
      # Support both prefixed and non-prefixed keys for robustness.
      - name: Resolve release outputs
        id: resolve
        env:
          RP_RELEASE_CREATED: ${{ steps.release.outputs['dashboard--release_created'] || steps.release.outputs.release_created }}
          RP_TAG_NAME: ${{ steps.release.outputs['dashboard--tag_name'] || steps.release.outputs.tag_name }}
          RP_VERSION: ${{ steps.release.outputs['dashboard--version'] || steps.release.outputs.version }}
        run: |
          {
            echo "release_created=${RP_RELEASE_CREATED}"
            echo "tag_name=${RP_TAG_NAME}"
            echo "version=${RP_VERSION}"
          } >> "$GITHUB_OUTPUT"

          if [ "${RP_RELEASE_CREATED}" = "true" ]; then
            echo "✅ Release created: ${RP_TAG_NAME} (${RP_VERSION})"
          else
            echo "ℹ️ No release created — Release Please PR opened/updated. Merging it releases automatically."
          fi

  # Resolve the tag to build (new release or the requested existing tag), its commit,
  # and whether it is the newest release. Everything downstream uses these outputs.
  resolve:
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event.inputs.action == 'build-existing-tag')
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
    steps:
      - name: Resolve tag, commit and latest
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ github.event.inputs.action }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$ACTION" = "build-existing-tag" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RP_TAG"
          fi
          if [[ ! "$TAG" =~ ^dashboard-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag_name must match dashboard-vX.Y.Z"
            exit 1
          fi

          # Commit the tag points to (commits/{ref} dereferences annotated tags).
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)

          # Only the newest release may move :latest and version.json.
          # Fails closed: if the latest release can't be read, the job fails.
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n1)" = "$TAG" ]; then
            IS_LATEST=true
          else
            IS_LATEST=false
          fi

          {
            echo "tag_name=${TAG}"
            echo "version=${TAG#dashboard-v}"
            echo "sha=${SHA}"
            echo "is_latest=${IS_LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} -> ${SHA} (latest release: ${LATEST}, is_latest=${IS_LATEST})"

  tag-contributors:
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Add contributors to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
        run: |
          CURRENT_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.body')
          if printf '%s\n' "$CURRENT_BODY" | grep -q '^## Contributors'; then
            echo "Contributors section already present, skipping"
            exit 0
          fi

          # Previous release = the one right before TAG_NAME in version order
          # (correct for rebuilds of older tags too, not just the newest one).
          PREV_TAG=$( { gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name'; echo "$TAG_NAME"; } \
            | grep -E '^dashboard-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV \
            | awk -v t="$TAG_NAME" '$0 == t { print p; exit } { p = $0 }')

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release found, skipping"
            exit 0
          fi

          CONTRIBUTORS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG_NAME}" \
            --jq '[.commits[].author.login // empty] | unique | map(select(. != "github-actions[bot]" and . != "dependabot[bot]" and . != "renovate[bot]")) | map("@" + .) | join(", ")' 2>/dev/null || echo "")

          if [ -z "$CONTRIBUTORS" ]; then
            echo "No external contributors found"
            exit 0
          fi

          NEW_BODY=$(printf '%s\n\n## Contributors\n\nThank you to the following contributors: %s' "${CURRENT_BODY}" "${CONTRIBUTORS}")

          # PATCH only exists on /releases/{id}, not /releases/tags/{tag}; gh release edit resolves the id.
          gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --notes "${NEW_BODY}"

          echo "Done"

  # Build each platform natively in parallel on GitHub-hosted runners — no QEMU emulation needed.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: ${{ matrix.platform }}
          no-cache: true
          build-args: |
            DASHBOARD_VERSION=${{ needs.resolve.outputs.tag_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge per-platform images into a single multi-arch manifest.
  merge:
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
        run: |
          TAGS="-t ${IMAGE}:${VERSION}"
          TAGS="$TAGS -t ${IMAGE}:sha-${SHA::7}"
          # Rebuilding an older tag must not move :latest backwards.
          if [ "$IS_LATEST" = "true" ]; then
            TAGS="$TAGS -t ${IMAGE}:latest"
          fi

          SOURCES=""
          for digest in *; do
            SOURCES="$SOURCES ${IMAGE}@sha256:$digest"
          done

          echo "📦 Creating multi-arch manifest..."
          echo "   Tags: $TAGS"
          echo "   Sources: $SOURCES"

          # shellcheck disable=SC2086 # word splitting is intended
          docker buildx imagetools create $TAGS $SOURCES

  # Update version.json so dashboards can check for updates without GitHub API rate limits.
  # Only for the newest release — rebuilding an older tag must not advertise it as the update.
  update-version-json:
    runs-on: ubuntu-latest
    needs: [resolve, merge]
    if: >-
      !cancelled() &&
      needs.merge.result == 'success' &&
      needs.resolve.outputs.is_latest == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          RELEASE_NOTES=$(gh release view "${TAG_NAME}" --json body -q .body 2>/dev/null | head -c 2000 || echo "")

          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${TAG_NAME}" \
            --arg url "${RELEASE_URL}" \
            --arg notes "${RELEASE_NOTES}" \
            '{version: $version, tag: $tag, releaseUrl: $url, releaseNotes: $notes}' \
            > version.json

      - name: Commit version.json
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update version.json to ${VERSION}"
          git push
